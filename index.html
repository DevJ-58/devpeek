<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DevPeek" />
  <meta name="theme-color" content="#059669" />
  <title>DevPeek</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts : DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet"
  />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ÉCRAN 1 : ACCUEIL (HOME)                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="screen" id="home-screen">
    <!-- En-tête -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <i class="material-icons">search</i>
        </div>
        <span class="logo-text">DevPeek</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">
          <i class="material-icons" id="theme-icon">dark_mode</i>
        </button>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="home-content">
      <div class="hero">
        <h1 class="hero-title">Bonjour 👋</h1>
        <p class="hero-subtitle">
          Connectez votre dev server pour voir votre site sur ce téléphone.
        </p>
      </div>

      <!-- Bouton principal -->
      <button class="primary-btn" id="connect-btn">
        <i class="material-icons">wifi_tethering</i>
        <span data-i18n="connect_server">Se connecter</span>
      </button>

      <!-- Section historique -->
      <div class="section">
        <div class="section-header">
          <span class="section-title" data-i18n="history">Récents</span>
          <button class="text-btn" id="clear-btn" data-i18n="clear_history">Effacer</button>
        </div>
        <div class="history-list" id="history-list"></div>
      </div>

      <div class="resolution-badge" id="resolution-badge">
        <i class="material-icons" style="font-size:13px">devices</i>
        <span id="resolution-text">…</span>
      </div>
    </div>

    <!-- Safe area bottom -->
    <div style="height: env(safe-area-inset-bottom, 24px); flex-shrink:0;"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ÉCRAN 2 : CONNEXION (CONNECT)                           -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="screen hidden" id="connect-screen">
    <!-- Header avec bouton retour -->
    <div class="header">
      <button class="icon-btn" id="back-btn-connect">
        <i class="material-icons">arrow_back</i>
      </button>
      <span class="header-title" data-i18n="connect_server">Connecter un serveur</span>
      <div style="width: 36px;"></div>
    </div>

    <!-- Onglets -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="manual" data-i18n="manual_input">Saisir l'URL</button>
      <button class="tab-btn" data-tab="scanner" data-i18n="scan_qr">Scanner le QR</button>
    </div>

    <!-- Contenu des onglets -->
    <div class="tabs-content">
      <!-- Onglet 1 : Saisie manuelle -->
      <div class="tab-pane active" id="tab-manual">
        <div class="form-group">
          <input
            type="url"
            id="url-input"
            class="url-input"
            inputmode="url"
            placeholder="http://192.168.x.x:3000"
            data-i18n-placeholder="url_placeholder"
          />
          <button class="primary-btn" id="connect-url-btn" data-i18n="connect">Connecter</button>
        </div>
      </div>

      <!-- Onglet 2 : Scanner QR -->
      <div class="tab-pane" id="tab-scanner">
        <div class="scanner-container" id="scanner-container">
          <video id="scanner-video" playsinline></video>
          <div class="scanner-overlay">
            <div class="scanner-frame">
              <span class="scanner-corner top-left"></span>
              <span class="scanner-corner top-right"></span>
              <span class="scanner-corner bottom-left"></span>
              <span class="scanner-corner bottom-right"></span>
            </div>
          </div>
        </div>
        <p class="scanner-hint" data-i18n="scanner_permission">Autoriser la caméra pour scanner le QR</p>
      </div>
    </div>

    <!-- Safe area bottom -->
    <div style="height: env(safe-area-inset-bottom, 24px); flex-shrink:0;"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ÉCRAN 3 : VIEWER                                        -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="screen hidden" id="viewer-screen">
    <!-- Iframe plein écran -->
    <iframe
      id="viewer-iframe"
      src="about:blank"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      title="Dev server preview"
    ></iframe>

    <!-- Barre de contrôles -->
    <div class="viewer-toolbar">
      <button class="toolbar-btn" id="back-btn-viewer">
        <i class="material-icons">arrow_back</i>
        <span data-i18n="back">Retour</span>
      </button>

      <button class="toolbar-btn" id="rotate-btn">
        <i class="material-icons">screen_rotation</i>
        <span data-i18n="rotate">Rotation</span>
      </button>

      <button class="toolbar-btn" id="theme-btn-viewer">
        <i class="material-icons">dark_mode</i>
        <span data-i18n="theme">Thème</span>
      </button>
    </div>
  </div>

  <!-- Service Worker -->
  <script src="/app.js"></script>

</body>
</html>
